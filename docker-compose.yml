services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mapper-db
    environment:
      POSTGRES_USER: mapper
      POSTGRES_PASSWORD: mapper
      POSTGRES_DB: mapper
    ports:
      - "5433:5432"
    volumes:
      - mapper-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapper -d mapper"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  mapper-pgdata:
